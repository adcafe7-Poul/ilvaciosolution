        <div class="bar glass">

              data-t-title="theme_idol"

      <section class="screen" id="listen">
        <div class="bar glass" data-lockable>
          <button type="button" class="ghost" data-back data-t="back">돌아가기</button>
          <div class="title" id="l-title"></div>

          <div class="seg" id="l-loop" role="group">

          <button type="button" class="orb" id="l-stop" data-t-aria="stop" data-t-title="stop">
            <svg><use href="#ic-stop" /></svg>

      <div class="peeks" aria-hidden="true">

        <div class="peek" style="--i: 2">

        </div>
        <div class="peek" style="--i: 7">
          <div class="peek-win"><img src="intro/idol.webp" alt="" /></div>
        </div>
        <div class="peek" style="--i: 4">
          <div class="peek-win"><img src="intro/robot.webp" alt="" /></div>
        </div>
        <div class="peek" style="--i: 1">
          <div class="peek-win"><img src="intro/crystal.webp" alt="" /></div>
        </div>
        <div class="peek" style="--i: 8">
          <div class="peek-win"><img src="intro/halloween.webp" alt="" /></div>
        </div>
        <div class="peek" style="--i: 3">
          <div class="peek-win"><img src="intro/dino.webp" alt="" /></div>
        </div>
        <div class="peek" style="--i: 6">
          <div class="peek-win"><img src="intro/snow.webp" alt="" /></div>
        </div>
      </div>
    </div>

    <dialog id="ask" class="glass">
      <h2></h2>
      <p></p>
      <div class="actions">
        <button type="button" class="secondary no"></button>
        <button type="button" class="primary yes"></button>
      </div>
    </dialog>
    <dialog id="about" class="glass">
      <h2 data-t="info">앱 정보</h2>
      <p data-t="privacy"></p>
      <label class="lever about-row"
        ><span data-t="effect">성공 축하 효과</span
        ><select id="fx-style"></select
      ></label>
      <p id="about-edition" class="about-edition"></p>
      <button type="button" class="secondary" id="about-restore" data-t="proRestore" hidden>
        구매 되살리기
      </button>
      <h3 data-t="credits"></h3>
      <p data-t="creditText"></p>
      <div class="actions">
        <button type="button" class="primary" id="about-close" data-t="close">닫기</button>
      </div>
    </dialog>
    <!-- 부모 확인 — 결제 앞(구글 가족 정책 «어른 확인») · 한 자리 수 둘의 곱 -->
    <dialog id="parent" class="glass">
      <h2 data-t="parentTitle">부모님 확인</h2>
      <p id="parent-q"></p>
      <input
        id="parent-a"
        class="parent-a"
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="3"
        autocomplete="off"
      />
      <div class="actions">
        <button type="button" class="secondary" id="parent-no" data-t="close">닫기</button>
        <button type="button" class="primary" id="parent-yes" data-t="parentOk">확인</button>
      </div>
    </dialog>
    <div id="toast" class="toast" role="status"></div>
  </body>
</html>
